<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Water Sort Puzzle - リアル水流ボトルパズル</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap');

        body {
            font-family: 'M PLUS Rounded 1c', 'Fredoka', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background-color: #1a1c23;
            background-image: 
                radial-gradient(circle at 25px 25px, rgba(255, 255, 255, 0.03) 2px, transparent 0),
                radial-gradient(circle at 75px 75px, rgba(255, 255, 255, 0.015) 2px, transparent 0);
            background-size: 100px 100px;
            overflow: hidden;
        }

        /* Tube Container & Clean 2D Glass styling */
        .tube-wrapper {
            position: relative;
            cursor: pointer;
            transition: transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .tube-wrapper.selected {
            transform: translateY(-24px);
        }

        .tube-wrapper.pouring-source {
            z-index: 40;
            transition: transform 0.35s ease-in-out;
        }

        @keyframes tubeShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .tube-wrapper.shake {
            animation: tubeShake 0.35s ease-in-out;
        }

        /* Thinner border and clean flat 2D look */
        .tube {
            position: relative;
            width: 52px;
            height: 176px;
            border: 2px solid rgba(255, 255, 255, 0.65);
            border-top: none;
            border-bottom-left-radius: 26px;
            border-bottom-right-radius: 26px;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column-reverse;
            transform-origin: 50% 15px;
            transition: transform 0.35s ease-in-out;
        }

        /* Thin flat glass lip top edge */
        .tube::before {
            content: '';
            position: absolute;
            top: 0;
            left: -2px;
            right: -2px;
            height: 4px;
            border: 2px solid rgba(255, 255, 255, 0.75);
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 25;
        }

        /* Subtle 2D vertical highlight */
        .tube::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 3px;
            height: 90%;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            pointer-events: none;
            z-index: 26;
        }

        /* Liquid unit layer (Flat pastel fill, no dark gradient) */
        .liquid-layer {
            width: 100%;
            position: relative;
            overflow: visible;
            transition: height 0.08s linear;
        }

        /* Subtle liquid surface wave */
        .liquid-surface-wave {
            position: absolute;
            top: -3px;
            left: -10%;
            width: 120%;
            height: 6px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            animation: liquidWave 1.1s infinite ease-in-out alternate;
            pointer-events: none;
        }

        @keyframes liquidWave {
            0% { transform: translateX(-4%) scaleY(0.8); }
            100% { transform: translateX(4%) scaleY(1.2); }
        }

        /* Active pouring splash ripples inside bottle */
        .surface-ripple {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 8px;
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            animation: rippleExpand 0.35s infinite ease-out;
            pointer-events: none;
        }

        @keyframes rippleExpand {
            0% { width: 10%; opacity: 0.9; }
            100% { width: 90%; opacity: 0; }
        }

        /* Liquid Pour SVG Stream overlay */
        .pour-svg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 45;
        }

        /* Dynamic fluid bubble in target bottle */
        .liquid-bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            animation: bubbleUp 0.45s ease-out forwards;
        }

        @keyframes bubbleUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0.9; }
            100% { transform: translateY(-32px) scale(1.3); opacity: 0; }
        }

        /* Splash droplet particles */
        .splash-particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            z-index: 60;
            animation: splashFly 0.38s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes splashFly {
            0% { transform: translate(0, 0) scale(1); opacity: 0.95; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
        }

        /* Custom tactile gaming buttons */
        .btn-game {
            background: linear-gradient(180deg, #FFDD67 0%, #F3B316 100%);
            border: 2px solid #FFEAA5;
            box-shadow: 0 4px 0 #B88000, 0 6px 12px rgba(0,0,0,0.4);
            color: #3D2300;
            transition: all 0.1s ease;
        }

        .btn-game:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #B88000, 0 2px 6px rgba(0,0,0,0.4);
        }

        .btn-game:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.6);
        }

        /* Modal glass styling */
        .modal-bg {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(8px);
        }

        /* Completed Tube Sparkle Glow */
        @keyframes tubeCompleteGlow {
            0% { box-shadow: 0 0 4px rgba(255,223,128,0.3); }
            50% { box-shadow: 0 0 16px rgba(255,223,128,0.7); }
            100% { box-shadow: 0 0 6px rgba(255,223,128,0.4); }
        }

        .tube.completed {
            animation: tubeCompleteGlow 1.5s infinite alternate;
            border-color: #FFE680;
        }

        /* Cork stopper for completed tubes (2D Flat) */
        .cork {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 34px;
            height: 14px;
            background: #C4A47C;
            border-radius: 3px 3px 2px 2px;
            border: 1.5px solid #8C6F4B;
            z-index: 30;
            animation: corkPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes corkPop {
            0% { transform: translate(-50%, -15px) scale(0.6); opacity: 0; }
            100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center text-white select-none">

    <!-- TOP HEADER / ACTION BUTTONS -->
    <header class="w-full max-w-md px-4 pt-4 flex justify-between items-center z-20">
        <button id="btn-menu" class="btn-game w-12 h-12 rounded-2xl flex items-center justify-center text-xl font-bold" title="メニュー">
            <i class="fa-solid fa-bars"></i>
        </button>

        <button id="btn-restart" class="btn-game w-12 h-12 rounded-2xl flex items-center justify-center text-xl font-bold" title="やり直す">
            <i class="fa-solid fa-rotate-right"></i>
        </button>

        <button id="btn-undo" class="btn-game h-12 px-3 rounded-2xl flex items-center justify-center gap-1.5 text-lg font-extrabold" title="1手戻す">
            <i class="fa-solid fa-rotate-left"></i>
            <span id="undo-count" class="text-base font-black">5</span>
        </button>

        <button id="btn-add-tube" class="btn-game h-12 px-3 rounded-2xl flex items-center justify-center gap-1.5 text-base font-extrabold" title="ボトルを追加">
            <i class="fa-solid fa-vial-circle-plus text-lg"></i>
            <span class="text-sm">+1</span>
        </button>

        <button id="btn-sound" class="btn-game w-12 h-12 rounded-2xl flex items-center justify-center text-lg font-bold" title="サウンド切り替え">
            <i id="sound-icon" class="fa-solid fa-volume-high"></i>
        </button>
    </header>

    <!-- LEVEL INDICATOR -->
    <div class="text-center mt-2 z-10">
        <h1 id="level-title" class="text-2xl sm:text-3xl font-extrabold tracking-wider text-amber-300 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">
            LEVEL 1
        </h1>
        <p id="move-counter" class="text-xs text-gray-400 font-bold mt-0.5">手数: 0</p>
    </div>

    <!-- PLAY AREA FOR TEST TUBES -->
    <main class="w-full max-w-lg flex-1 flex flex-col justify-center items-center px-3 relative my-auto">
        <!-- SVG Stream overlay for pouring fluid (supports multiple active streams) -->
        <svg id="pour-svg" class="pour-svg-container">
            <defs>
                <filter id="liquid-glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="1.5" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>
            <g id="active-streams-group"></g>
        </svg>
        <div id="splash-container"></div>

        <!-- Dynamic Tube Rows Grid -->
        <div id="tubes-container" class="w-full flex flex-col items-center justify-center gap-8 sm:gap-12 py-4">
            <!-- Tubes inserted dynamically by JS -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="pb-3 text-center text-xs text-gray-500 font-medium">
        Water Sort Puzzle &bull; シームレスな水の流れ
    </footer>

    <!-- VICTORY CELEBRATION MODAL -->
    <div id="win-modal" class="fixed inset-0 modal-bg flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-gray-800 border-2 border-amber-400 rounded-3xl p-6 w-80 text-center shadow-2xl transform scale-90 transition-transform duration-300 modal-content">
            <div class="w-20 h-20 bg-amber-400 rounded-full flex items-center justify-center mx-auto -mt-12 shadow-lg border-4 border-gray-800">
                <i class="fa-solid fa-trophy text-4xl text-amber-950"></i>
            </div>
            <h2 class="text-2xl font-black text-amber-300 mt-4">STAGE CLEAR!</h2>
            <p class="text-gray-300 text-sm mt-1">美しい水の色揃えが完了しました！</p>
            
            <div class="bg-gray-900/60 rounded-2xl p-3 my-4 flex justify-around text-center border border-gray-700">
                <div>
                    <div class="text-xs text-gray-400 font-bold">クリア手数</div>
                    <div id="final-moves" class="text-xl font-black text-white">0</div>
                </div>
                <div class="border-r border-gray-700"></div>
                <div>
                    <div class="text-xs text-gray-400 font-bold">ステージ</div>
                    <div id="final-level" class="text-xl font-black text-amber-400">LV 1</div>
                </div>
            </div>

            <button id="btn-next-level" class="btn-game w-full py-3.5 rounded-2xl text-lg font-black tracking-wide flex items-center justify-center gap-2">
                <span>次のレベルへ</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- PAUSE / LEVEL SELECT MODAL -->
    <div id="menu-modal" class="fixed inset-0 modal-bg flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-gray-800 border-2 border-gray-600 rounded-3xl p-6 w-84 max-w-[90vw] text-center shadow-2xl modal-content">
            <h2 class="text-2xl font-black text-white mb-4">レベル選択</h2>
            
            <div class="space-y-3 mb-6">
                <div id="level-grid" class="grid grid-cols-4 gap-2 max-h-48 overflow-y-auto p-1 text-sm font-bold">
                    <!-- Level quick-jump buttons -->
                </div>
            </div>

            <div class="flex gap-3">
                <button id="btn-close-menu" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-2xl border border-gray-500">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT GAME LOGIC -->
    <script>
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.activeAudioNodes = new Map();
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            startPourSound(pourId, fillLevel) {
                if (this.muted) return;
                this.init();
                this.stopPourSound(pourId);

                const bufferSize = this.ctx.sampleRate * 2;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                noise.loop = true;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                const baseFreq = 420 + (fillLevel * 130);
                filter.frequency.setValueAtTime(baseFreq, this.ctx.currentTime);
                filter.Q.setValueAtTime(3.2, this.ctx.currentTime);

                const osc = this.ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(baseFreq * 1.85, this.ctx.currentTime);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.1, this.ctx.currentTime + 0.08);

                noise.connect(filter);
                filter.connect(gain);
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start();
                osc.start();

                this.activeAudioNodes.set(pourId, { noise, osc, gain, filter });
            }

            updatePourPitch(pourId, fillLevel) {
                const node = this.activeAudioNodes.get(pourId);
                if (node && this.ctx) {
                    const baseFreq = 440 + (fillLevel * 160);
                    node.filter.frequency.setTargetAtTime(baseFreq, this.ctx.currentTime, 0.04);
                    node.osc.frequency.setTargetAtTime(baseFreq * 1.85, this.ctx.currentTime, 0.04);
                }
            }

            stopPourSound(pourId) {
                const node = this.activeAudioNodes.get(pourId);
                if (node && this.ctx) {
                    try {
                        node.gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
                        setTimeout(() => {
                            try {
                                node.noise.stop();
                                node.osc.stop();
                            } catch (e) {}
                            this.activeAudioNodes.delete(pourId);
                        }, 60);
                    } catch (e) {
                        this.activeAudioNodes.delete(pourId);
                    }
                }
            }

            playSelect() {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(460, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(680, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playError() {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(110, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playWin() {
                if (this.muted) return;
                this.init();
                const melody = [
                    {f: 523.25, d: 0.15}, {f: 659.25, d: 0.15}, {f: 783.99, d: 0.15},
                    {f: 1046.50, d: 0.4}
                ];
                let time = 0;
                melody.forEach(note => {
                    setTimeout(() => {
                        if (this.muted) return;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(note.f, this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + note.d);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start();
                        osc.stop(this.ctx.currentTime + note.d);
                    }, time * 1000);
                    time += note.d * 0.8;
                });
            }
        }

        const audio = new SoundFX();

        /* Soft 2D Pastel Color Palette */
        const COLOR_PALETTE = [
            { id: 1, name: 'Pastel Red', hex: '#FF8A80', darkHex: '#FF8A80' },
            { id: 2, name: 'Pastel Blue', hex: '#80D8FF', darkHex: '#80D8FF' },
            { id: 3, name: 'Pastel Green', hex: '#B9F6CA', darkHex: '#B9F6CA' },
            { id: 4, name: 'Pastel Orange', hex: '#FFD180', darkHex: '#FFD180' },
            { id: 5, name: 'Pastel Pink', hex: '#FF80AB', darkHex: '#FF80AB' },
            { id: 6, name: 'Pastel Purple', hex: '#EA80FC', darkHex: '#EA80FC' },
            { id: 7, name: 'Pastel Cyan', hex: '#A7F0F9', darkHex: '#A7F0F9' },
            { id: 8, name: 'Pastel Yellow', hex: '#FFE57F', darkHex: '#FFE57F' },
            { id: 9, name: 'Pastel Grey', hex: '#CFD8DC', darkHex: '#CFD8DC' },
            { id: 10, name: 'Pastel Mint', hex: '#A7F3D0', darkHex: '#A7F3D0' },
            { id: 11, name: 'Pastel Brown', hex: '#D7CCC8', darkHex: '#D7CCC8' },
            { id: 12, name: 'Pastel Indigo', hex: '#C5CAE9', darkHex: '#C5CAE9' }
        ];

        const TUBE_CAPACITY = 4;

        let currentLevel = 1;
        let tubes = [];
        let initialTubesState = [];
        let selectedTubeIndex = null;
        let moveHistory = [];
        let moveCount = 0;
        let undoRemaining = 5;

        // Tracks active pouring operations to allow simultaneous movement
        const activePourSourceSet = new Set();
        const activePourDestSet = new Set();
        let pourIdCounter = 0;

        // Group consecutive same colors into a single block
        function getGroupedLayers(tubeContents) {
            if (!tubeContents || tubeContents.length === 0) return [];
            const groups = [];
            let currentColor = tubeContents[0];
            let count = 1;

            for (let i = 1; i < tubeContents.length; i++) {
                if (tubeContents[i] === currentColor) {
                    count++;
                } else {
                    groups.push({ colorId: currentColor, count: count });
                    currentColor = tubeContents[i];
                    count = 1;
                }
            }
            groups.push({ colorId: currentColor, count: count });
            return groups;
        }

        function canPour(fromIdx, toIdx) {
            if (fromIdx === toIdx) return false;
            // Prevent pouring from/to bottles currently involved in another active pour
            if (activePourSourceSet.has(fromIdx) || activePourDestSet.has(fromIdx)) return false;
            if (activePourSourceSet.has(toIdx) || activePourDestSet.has(toIdx)) return false;

            const source = tubes[fromIdx];
            const dest = tubes[toIdx];

            if (!source || source.length === 0) return false;
            if (dest.length >= TUBE_CAPACITY) return false;

            if (dest.length === 0) return true;
            return source[source.length - 1] === dest[dest.length - 1];
        }

        function handleTubeClick(idx) {
            // Ignore click if this bottle is actively pouring/receiving liquid
            if (activePourSourceSet.has(idx) || activePourDestSet.has(idx)) return;

            if (selectedTubeIndex === null) {
                const clickedTube = tubes[idx];
                if (!clickedTube || clickedTube.length === 0) return;

                const isComplete = clickedTube.length === TUBE_CAPACITY && clickedTube.every(c => c === clickedTube[0]);
                if (isComplete) {
                    shakeTube(idx);
                    audio.playError();
                    return;
                }

                selectedTubeIndex = idx;
                audio.playSelect();
                renderBoard();
                return;
            }

            if (selectedTubeIndex === idx) {
                selectedTubeIndex = null;
                audio.playSelect();
                renderBoard();
                return;
            }

            if (canPour(selectedTubeIndex, idx)) {
                const from = selectedTubeIndex;
                selectedTubeIndex = null;
                executePourAnimation(from, idx);
            } else {
                shakeTube(idx);
                audio.playError();

                if (tubes[idx] && tubes[idx].length > 0) {
                    const isComplete = tubes[idx].length === TUBE_CAPACITY && tubes[idx].every(c => c === tubes[idx][0]);
                    if (!isComplete && !activePourSourceSet.has(idx) && !activePourDestSet.has(idx)) {
                        selectedTubeIndex = idx;
                        renderBoard();
                    }
                }
            }
        }

        function shakeTube(idx) {
            const wrapper = document.querySelector(`.tube-wrapper[data-index="${idx}"]`);
            if (wrapper) {
                wrapper.classList.add('shake');
                setTimeout(() => wrapper.classList.remove('shake'), 350);
            }
        }

        function generateSolvableLevel(levelNum) {
            let numColors = 2;
            if (levelNum >= 2) numColors = 3;
            if (levelNum >= 4) numColors = 4;
            if (levelNum >= 7) numColors = 5;
            if (levelNum >= 11) numColors = 6;
            if (levelNum >= 16) numColors = 7;
            if (levelNum >= 22) numColors = 8;
            if (levelNum >= 30) numColors = Math.min(9, COLOR_PALETTE.length);

            const numEmptyTubes = 2;
            const totalTubes = numColors + numEmptyTubes;

            let state = [];
            for (let c = 0; c < numColors; c++) {
                const colorId = COLOR_PALETTE[c].id;
                state.push([colorId, colorId, colorId, colorId]);
            }
            for (let e = 0; e < numEmptyTubes; e++) {
                state.push([]);
            }

            const shuffleSteps = 35 + levelNum * 6;
            let lastFrom = -1;
            let lastTo = -1;

            for (let step = 0; step < shuffleSteps; step++) {
                let validMoves = [];

                for (let from = 0; from < totalTubes; from++) {
                    if (state[from].length === 0) continue;

                    for (let to = 0; to < totalTubes; to++) {
                        if (from === to) continue;
                        if (state[to].length >= TUBE_CAPACITY) continue;
                        if (from === lastTo && to === lastFrom) continue;

                        validMoves.push({ from, to });
                    }
                }

                if (validMoves.length === 0) break;

                const move = validMoves[Math.floor(Math.random() * validMoves.length)];
                const item = state[move.from].pop();
                state[move.to].push(item);

                lastFrom = move.from;
                lastTo = move.to;
            }

            let isAlreadySolved = state.every(t => t.length === 0 || (t.length === TUBE_CAPACITY && t.every(c => c === t[0])));
            if (isAlreadySolved) {
                return generateSolvableLevel(levelNum);
            }

            return state;
        }

        function renderBoard() {
            const container = document.getElementById('tubes-container');
            container.innerHTML = '';

            const totalTubes = tubes.length;
            let topRowTubes = Math.ceil(totalTubes / 2);
            if (totalTubes <= 4) topRowTubes = totalTubes;

            const row1 = document.createElement('div');
            row1.className = 'flex justify-center items-center gap-3 sm:gap-6 flex-wrap';

            const row2 = document.createElement('div');
            row2.className = 'flex justify-center items-center gap-3 sm:gap-6 flex-wrap';

            tubes.forEach((tubeContents, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = `tube-wrapper ${selectedTubeIndex === idx ? 'selected' : ''}`;
                wrapper.dataset.index = idx;
                wrapper.onclick = () => handleTubeClick(idx);

                const tubeEl = document.createElement('div');
                tubeEl.className = 'tube';
                tubeEl.id = `tube-${idx}`;

                const isComplete = tubeContents.length === TUBE_CAPACITY && tubeContents.every(c => c === tubeContents[0]);
                if (isComplete) {
                    tubeEl.classList.add('completed');
                    const cork = document.createElement('div');
                    cork.className = 'cork';
                    tubeEl.appendChild(cork);
                }

                // Group consecutive same colors into a single seamless div
                const groupedLayers = getGroupedLayers(tubeContents);

                groupedLayers.forEach((group, gIdx) => {
                    const colorObj = COLOR_PALETTE.find(c => c.id === group.colorId) || COLOR_PALETTE[0];
                    const layer = document.createElement('div');
                    layer.className = 'liquid-layer';
                    layer.dataset.colorId = group.colorId;
                    
                    // Flat pastel fill for 2D aesthetics
                    layer.style.backgroundColor = colorObj.hex;
                    layer.style.height = `${(group.count / TUBE_CAPACITY) * 100}%`;

                    // Only top layer has surface wave
                    if (gIdx === groupedLayers.length - 1) {
                        const wave = document.createElement('div');
                        wave.className = 'liquid-surface-wave';
                        layer.appendChild(wave);
                    }

                    tubeEl.appendChild(layer);
                });

                wrapper.appendChild(tubeEl);

                if (idx < topRowTubes) {
                    row1.appendChild(wrapper);
                } else {
                    row2.appendChild(wrapper);
                }
            });

            container.appendChild(row1);
            if (row2.hasChildNodes()) {
                container.appendChild(row2);
            }

            document.getElementById('level-title').innerText = `LEVEL ${currentLevel}`;
            document.getElementById('move-counter').innerText = `手数: ${moveCount}`;
            document.getElementById('undo-count').innerText = undoRemaining;
            document.getElementById('btn-undo').disabled = moveHistory.length === 0 || undoRemaining <= 0 || activePourSourceSet.size > 0;
        }

        // Direct DOM Liquid update for ultra-smooth dynamic volume animation while pouring concurrently
        function updateTubeLiquidDOM(idx) {
            const tubeEl = document.getElementById(`tube-${idx}`);
            if (!tubeEl) return;

            const isComplete = tubes[idx].length === TUBE_CAPACITY && tubes[idx].every(c => c === tubes[idx][0]);
            if (isComplete && !tubeEl.querySelector('.cork')) {
                tubeEl.classList.add('completed');
                const cork = document.createElement('div');
                cork.className = 'cork';
                tubeEl.appendChild(cork);
            }

            // Remove existing liquid layers to redraw cleanly
            const existingLayers = tubeEl.querySelectorAll('.liquid-layer');
            existingLayers.forEach(l => l.remove());

            const groupedLayers = getGroupedLayers(tubes[idx]);
            groupedLayers.forEach((group, gIdx) => {
                const colorObj = COLOR_PALETTE.find(c => c.id === group.colorId) || COLOR_PALETTE[0];
                const layer = document.createElement('div');
                layer.className = 'liquid-layer';
                layer.dataset.colorId = group.colorId;
                layer.style.backgroundColor = colorObj.hex;
                layer.style.height = `${(group.count / TUBE_CAPACITY) * 100}%`;

                if (gIdx === groupedLayers.length - 1) {
                    const wave = document.createElement('div');
                    wave.className = 'liquid-surface-wave';
                    layer.appendChild(wave);
                }
                tubeEl.appendChild(layer);
            });
        }

        function triggerLiquidSplash(x, y, colorHex) {
            const container = document.getElementById('splash-container');
            const particleCount = 2 + Math.floor(Math.random() * 3);

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'splash-particle';
                const size = 3 + Math.random() * 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.backgroundColor = colorHex;
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                const angle = (Math.PI * (0.2 + Math.random() * 0.6));
                const distance = 10 + Math.random() * 18;
                const dx = Math.cos(angle) * (Math.random() > 0.5 ? distance : -distance);
                const dy = -Math.sin(angle) * distance;

                particle.style.setProperty('--dx', `${dx}px`);
                particle.style.setProperty('--dy', `${dy}px`);

                container.appendChild(particle);
                setTimeout(() => particle.remove(), 380);
            }
        }

        function triggerTargetBubbles(tubeEl) {
            const topLayer = tubeEl.lastElementChild;
            if (!topLayer || !topLayer.classList.contains('liquid-layer')) return;

            for (let i = 0; i < 2; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'liquid-bubble';
                const size = 3 + Math.random() * 3.5;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${20 + Math.random() * 60}%`;
                bubble.style.bottom = '4px';
                topLayer.appendChild(bubble);

                setTimeout(() => bubble.remove(), 450);
            }
        }

        // SIMULTANEOUS REAL-TIME POURING ANIMATION ENGINE
        function executePourAnimation(fromIdx, toIdx) {
            const pourId = `pour-${++pourIdCounter}`;
            activePourSourceSet.add(fromIdx);
            activePourDestSet.add(toIdx);

            const fromWrapper = document.querySelector(`.tube-wrapper[data-index="${fromIdx}"]`);
            const toWrapper = document.querySelector(`.tube-wrapper[data-index="${toIdx}"]`);
            const streamsGroup = document.getElementById('active-streams-group');

            if (!fromWrapper || !toWrapper) {
                activePourSourceSet.delete(fromIdx);
                activePourDestSet.delete(toIdx);
                return;
            }

            // Save history for Undo feature
            moveHistory.push({
                tubes: JSON.parse(JSON.stringify(tubes)),
                moveCount: moveCount
            });
            moveCount++;
            document.getElementById('move-counter').innerText = `手数: ${moveCount}`;

            const colorToPour = tubes[fromIdx][tubes[fromIdx].length - 1];
            const colorObj = COLOR_PALETTE.find(c => c.id === colorToPour) || COLOR_PALETTE[0];

            // Count units to transfer
            let pourAmount = 0;
            const topColor = tubes[fromIdx][tubes[fromIdx].length - 1];
            for (let i = tubes[fromIdx].length - 1; i >= 0; i--) {
                if (tubes[fromIdx][i] === topColor && (tubes[toIdx].length + pourAmount) < TUBE_CAPACITY) {
                    pourAmount++;
                } else {
                    break;
                }
            }

            fromWrapper.classList.add('pouring-source');
            const fromTube = fromWrapper.querySelector('.tube');

            // Determine tilt direction relative to target position
            const fromRect = fromWrapper.getBoundingClientRect();
            const toRect = toWrapper.getBoundingClientRect();
            const isTargetOnLeft = toRect.left < fromRect.left;
            const tiltAngle = isTargetOnLeft ? -72 : 72;

            // Lift and tilt bottle to pouring spot smoothly
            const pourOffsetX = isTargetOnLeft ? (toRect.left - fromRect.left + 45) : (toRect.left - fromRect.left - 45);
            const pourOffsetY = toRect.top - fromRect.top - 55;

            fromWrapper.style.transform = `translate(${pourOffsetX}px, ${pourOffsetY}px)`;
            fromTube.style.transform = `rotate(${tiltAngle}deg)`;

            // Create dedicated SVG elements for this pour stream
            const streamPathOuter = document.createElementNS("http://www.w3.org/2000/svg", "path");
            const streamPathInner = document.createElementNS("http://www.w3.org/2000/svg", "path");

            streamPathOuter.setAttribute('fill', 'none');
            streamPathOuter.setAttribute('stroke-linecap', 'round');
            streamPathOuter.setAttribute('stroke', colorObj.hex);
            streamPathOuter.setAttribute('stroke-width', '7');
            streamPathOuter.setAttribute('filter', 'url(#liquid-glow)');

            streamPathInner.setAttribute('fill', 'none');
            streamPathInner.setAttribute('stroke-linecap', 'round');
            streamPathInner.setAttribute('stroke', '#ffffff');
            streamPathInner.setAttribute('stroke-opacity', '0.75');
            streamPathInner.setAttribute('stroke-width', '2.5');

            streamsGroup.appendChild(streamPathOuter);
            streamsGroup.appendChild(streamPathInner);

            // Wait for bottle tilt transition to complete, then flow water
            setTimeout(() => {
                audio.startPourSound(pourId, tubes[toIdx].length / TUBE_CAPACITY);

                let stepsDone = 0;
                const pourInterval = setInterval(() => {
                    const currentFromRect = fromWrapper.getBoundingClientRect();
                    const currentToRect = toWrapper.getBoundingClientRect();

                    // Calculate lip spout position
                    const spoutX = isTargetOnLeft ? currentFromRect.left + 8 : currentFromRect.right - 8;
                    const spoutY = currentFromRect.top + 22;

                    // Calculate liquid surface level inside target tube
                    const destFillRatio = (tubes[toIdx].length + 1) / TUBE_CAPACITY;
                    const destTargetY = currentToRect.bottom - (currentToRect.height * destFillRatio) + 12;
                    const destTargetX = currentToRect.left + (currentToRect.width / 2);

                    // Dynamic curved bezier path for fluid stream
                    const midControlX = (spoutX + destTargetX) / 2;
                    const midControlY = Math.min(spoutY, destTargetX) - 15;
                    const d = `M ${spoutX} ${spoutY} Q ${midControlX} ${midControlY} ${destTargetX} ${destTargetY}`;

                    streamPathOuter.setAttribute('d', d);
                    streamPathInner.setAttribute('d', d);

                    if (stepsDone < pourAmount) {
                        const unit = tubes[fromIdx].pop();
                        tubes[toIdx].push(unit);
                        stepsDone++;

                        updateTubeLiquidDOM(fromIdx);
                        updateTubeLiquidDOM(toIdx);

                        audio.updatePourPitch(pourId, tubes[toIdx].length / TUBE_CAPACITY);
                        triggerLiquidSplash(destTargetX, destTargetY, colorObj.hex);

                        const toTubeEl = document.getElementById(`tube-${toIdx}`);
                        if (toTubeEl) triggerTargetBubbles(toTubeEl);
                    } else {
                        clearInterval(pourInterval);
                        audio.stopPourSound(pourId);

                        // Fade stream line out
                        streamPathOuter.remove();
                        streamPathInner.remove();

                        // Return bottle to original position
                        fromWrapper.style.transform = '';
                        fromTube.style.transform = '';
                        fromWrapper.classList.remove('pouring-source');

                        setTimeout(() => {
                            activePourSourceSet.delete(fromIdx);
                            activePourDestSet.delete(toIdx);
                            renderBoard();
                            checkWinCondition();
                        }, 280);
                    }
                }, 180);
            }, 260);
        }

        function checkWinCondition() {
            if (activePourSourceSet.size > 0) return; // Wait until all active pours complete

            const isWon = tubes.every(tube => {
                return tube.length === 0 || (tube.length === TUBE_CAPACITY && tube.every(c => c === tube[0]));
            });

            if (isWon) {
                audio.playWin();
                confetti({
                    particleCount: 120,
                    spread: 70,
                    origin: { y: 0.6 }
                });

                document.getElementById('final-moves').innerText = moveCount;
                document.getElementById('final-level').innerText = `LV ${currentLevel}`;

                const winModal = document.getElementById('win-modal');
                winModal.classList.remove('hidden');
                setTimeout(() => {
                    winModal.classList.remove('opacity-0');
                    winModal.querySelector('.modal-content').classList.remove('scale-90');
                }, 10);
            }
        }

        function initGame(level = 1) {
            currentLevel = level;
            moveCount = 0;
            moveHistory = [];
            selectedTubeIndex = null;
            undoRemaining = 5;
            activePourSourceSet.clear();
            activePourDestSet.clear();

            tubes = generateSolvableLevel(currentLevel);
            initialTubesState = JSON.parse(JSON.stringify(tubes));

            renderBoard();
        }

        // --- BUTTON EVENT LISTENERS ---

        document.getElementById('btn-restart').onclick = () => {
            if (activePourSourceSet.size > 0) return;
            tubes = JSON.parse(JSON.stringify(initialTubesState));
            moveCount = 0;
            moveHistory = [];
            selectedTubeIndex = null;
            renderBoard();
        };

        document.getElementById('btn-undo').onclick = () => {
            if (activePourSourceSet.size > 0 || moveHistory.length === 0 || undoRemaining <= 0) return;
            const lastState = moveHistory.pop();
            tubes = lastState.tubes;
            moveCount = lastState.moveCount;
            undoRemaining--;
            selectedTubeIndex = null;
            renderBoard();
        };

        document.getElementById('btn-add-tube').onclick = () => {
            if (activePourSourceSet.size > 0) return;
            tubes.push([]);
            renderBoard();
        };

        document.getElementById('btn-sound').onclick = () => {
            audio.muted = !audio.muted;
            const icon = document.getElementById('sound-icon');
            icon.className = audio.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
        };

        document.getElementById('btn-next-level').onclick = () => {
            const winModal = document.getElementById('win-modal');
            winModal.classList.add('opacity-0');
            setTimeout(() => {
                winModal.classList.add('hidden');
                initGame(currentLevel + 1);
            }, 300);
        };

        document.getElementById('btn-menu').onclick = () => {
            const menuModal = document.getElementById('menu-modal');
            const levelGrid = document.getElementById('level-grid');
            levelGrid.innerHTML = '';

            for (let i = 1; i <= 30; i++) {
                const btn = document.createElement('button');
                btn.className = `py-2 rounded-xl border ${i === currentLevel ? 'bg-amber-400 text-gray-900 border-amber-300 font-extrabold' : 'bg-gray-700 text-white border-gray-600'}`;
                btn.innerText = i;
                btn.onclick = () => {
                    menuModal.classList.add('opacity-0');
                    setTimeout(() => {
                        menuModal.classList.add('hidden');
                        initGame(i);
                    }, 300);
                };
                levelGrid.appendChild(btn);
            }

            menuModal.classList.remove('hidden');
            setTimeout(() => menuModal.classList.remove('opacity-0'), 10);
        };

        document.getElementById('btn-close-menu').onclick = () => {
            const menuModal = document.getElementById('menu-modal');
            menuModal.classList.add('opacity-0');
            setTimeout(() => menuModal.classList.add('hidden'), 300);
        };

        // Initialize on load
        window.onload = () => {
            initGame(1);
        };
    </script>
</body>
</html>
